[project]
name = "jmac-worker"
version = "0.4.0"
description = "Pinned local model evaluation for JMAC benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
inference = ["torch==2.14.1", "transformers==5.20.1"]
provider = [
    "convex==0.8.1",
]
chain = [
    "web3==7.16.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = ["ruff==0.17.1"]
