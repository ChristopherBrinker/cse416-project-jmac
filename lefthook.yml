pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: bun x oxlint {staged_files}
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      exclude: '(^|/)(convex/_generated/|src/env\.ts|\.next/)'
    - name: format
      run: bun x oxfmt --check {staged_files}
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yml,yaml}"
      exclude: '(^|/)(convex/_generated/|src/env\.ts|\.next/)'
